name: Bug report
description: Report a reproducible problem without private resident data.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include steps and whether usage, scope, coverage or sync is wrong.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: App version, OS/build and redacted network/device conditions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Remove names, SSIDs, device IDs, credentials and personal history. Report vulnerabilities privately.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and private resident/network data.
          required: true
